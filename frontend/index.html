<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="GodEye is a road awareness project being built for community pothole reporting, mapped hazards, and repair visibility."
    />

    <meta name="theme-color" content="#090f18" />

    <link rel="icon" href="/brand/favicon.ico" sizes="any" />

    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />

    <title>GodEye | Know the Road Ahead</title>
  </head>

  <body>
    <div id="root">
      <p id="godeye-boot" style="padding: 24px; color: #f8fafc; background: #0b1220; font-family: Arial, sans-serif">
        Starting GodEye…
      </p>
    </div>

    <script>
      window.setTimeout(function () {
        var indicator = document.getElementById("godeye-boot");

        if (indicator) {
          indicator.textContent = "GodEye startup is taking too long. Application files may not have loaded.";
        }
      }, 20000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
