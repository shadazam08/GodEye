name: GodEye - Backend tests

on:
  push:
    branches: [main, dev, android-app]
    paths:
      - backend/**
      - .github/workflows/backend-tests.yml
  pull_request:
    paths:
      - backend/**
      - .github/workflows/backend-tests.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godeye-backend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      # Used only to import the engine. Tests replace database dependencies with
      # mocks or isolated SQLite; this address must never be a production DB.
      DATABASE_URL: postgresql+psycopg://test:test@127.0.0.1:1/godeye_test

    steps:
      - name: Check out project
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Check dependencies
        run: python -m pip check

      - name: Run backend tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
